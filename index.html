<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドローン国家資格 学科対策 | DroneQuizApp</title>
<style>
  :root{
    --navy-top:#0a2a4d;
    --navy-deep:#002244;
    --navy-bottom:#00152b;
    --accent:#2b73fa;
    --accent-soft:rgba(43,115,250,0.14);
    --success:#33b373;
    --success-soft:rgba(51,179,115,0.16);
    --failure:#e6534d;
    --failure-soft:rgba(230,83,77,0.16);
    --text-primary:#ffffff;
    --text-secondary:rgba(255,255,255,0.62);
    --text-tertiary:rgba(255,255,255,0.4);
    --card-bg:rgba(255,255,255,0.05);
    --card-bg-strong:rgba(255,255,255,0.08);
    --card-border:rgba(255,255,255,0.09);
    --warn:#ffb020;
    --warn-soft:rgba(255,176,32,0.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #f3f5f9 0%, #e4e8ef 45%, #d6dbe4 100%);
    color:var(--text-primary);
  }

  /* ---------- Desktop layout: phone frame ---------- */
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:32px 16px;
  }

  .page-caption{
    text-align:center;
    color:#5b6472;
  }
  .page-caption b{
    color:#1a2233;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .page-caption span{
    display:block;
    font-size:12.5px;
    margin-top:4px;
    color:#8992a1;
  }

  .phone-frame{
    position:relative;
    width:390px;
    height:844px;
    max-height:88vh;
    background:linear-gradient(160deg,#1b1d22,#08090b);
    border-radius:56px;
    padding:14px;
    box-shadow:
      0 40px 80px -20px rgba(10,20,40,0.45),
      0 10px 30px -10px rgba(10,20,40,0.35),
      inset 0 0 0 2px rgba(255,255,255,0.06);
  }
  .phone-frame::before{ /* side buttons - right (power) */
    content:"";
    position:absolute; right:-3px; top:180px;
    width:3px; height:70px; border-radius:2px;
    background:#2a2c31;
  }
  .phone-frame::after{ /* side buttons - left (volume) */
    content:"";
    position:absolute; left:-3px; top:140px;
    width:3px; height:46px; border-radius:2px;
    background:#2a2c31;
    box-shadow: 0 60px 0 0 #2a2c31, 0 108px 0 0 #2a2c31;
  }

  .phone-notch{
    position:absolute;
    top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:26px;
    background:#08090b;
    border-radius:16px;
    z-index:20;
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:14px;
  }
  .phone-notch .cam{
    width:8px; height:8px; border-radius:50%;
    background:#1b2735;
    box-shadow: inset 0 0 0 1.5px #0d1520;
  }

  .phone-screen{
    position:relative;
    width:100%; height:100%;
    border-radius:42px;
    overflow:hidden;
    background:linear-gradient(180deg,var(--navy-top) 0%, var(--navy-deep) 45%, var(--navy-bottom) 100%);
    display:flex;
    flex-direction:column;
  }

  /* ---------- fake iOS status bar ---------- */
  .status-bar{
    flex:0 0 auto;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px 0 30px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    color:#fff;
  }
  .status-icons{ display:flex; align-items:center; gap:6px; }
  .status-icons svg{ display:block; }

  /* ---------- app content area ---------- */
  .app-content{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    display:flex;
    flex-direction:column;
  }
  .app-content::-webkit-scrollbar{ display:none; }

  .screen{
    display:none;
    flex-direction:column;
    flex:1 1 auto;
    min-height:100%;
    animation:fadeIn .28s ease;
  }
  .screen.active{ display:flex; }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ================= MENU SCREEN ================= */
  .menu-header{ padding:6px 20px 0; }
  .menu-header h1{
    margin:0 0 6px;
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .menu-header p{
    margin:0;
    font-size:13.5px;
    color:var(--text-secondary);
    line-height:1.5;
  }

  .license-picker{
    position:relative;
    margin:18px 20px 0;
    display:flex;
    gap:0;
    padding:4px;
    background:rgba(255,255,255,0.06);
    border-radius:14px;
  }
  .license-thumb{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width:calc(50% - 4px);
    background:var(--accent);
    border-radius:10px;
    box-shadow:0 4px 14px rgba(43,115,250,0.35);
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.65,0,.35,1);
    z-index:0;
  }
  .license-btn{
    position:relative;
    z-index:1;
    flex:1;
    border:none;
    cursor:pointer;
    padding:10px 0;
    font-size:13.5px;
    font-weight:700;
    border-radius:10px;
    background:transparent;
    color:rgba(255,255,255,0.55);
    transition:color .2s ease;
    font-family:inherit;
  }
  .license-btn.active{
    color:#fff;
  }

  /* ---------- progress gauge (level-up feel) ---------- */
  .progress-card{
    margin:14px 20px 0;
    padding:15px 16px;
    border-radius:18px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
  }
  .progress-card-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .progress-card-title{
    font-size:12.5px; font-weight:700; color:var(--text-secondary);
  }
  .progress-card-pct{
    font-size:19px; font-weight:800; color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .progress-bar-track{
    height:10px; border-radius:99px;
    background:rgba(255,255,255,0.1);
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%; width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--accent), var(--success));
    transition:width .9s cubic-bezier(.22,1,.36,1);
  }
  .progress-card-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:9px;
    font-size:11px; font-weight:600; color:var(--text-secondary);
  }

  .compliance-banner{
    margin:16px 20px 0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    background:var(--accent-soft);
    border:1px solid rgba(43,115,250,0.32);
    border-radius:14px;
  }
  .compliance-banner .icon{
    flex:0 0 auto;
    width:20px; height:20px;
    color:var(--accent);
  }
  .compliance-banner .texts b{
    display:block;
    font-size:12.5px;
    font-weight:700;
  }
  .compliance-banner .texts span{
    display:block;
    font-size:11px;
    color:var(--text-secondary);
    margin-top:1px;
  }

  .section-title{
    margin:22px 20px 10px;
    font-size:14.5px;
    font-weight:700;
  }

  /* ---------- weak point mode card ---------- */
  .weakpoint-wrap{ margin:16px 20px 0; }
  .weakpoint-card{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 16px;
    border-radius:18px;
    border:1px solid rgba(255,176,32,0.35);
    background:linear-gradient(135deg, rgba(255,176,32,0.16) 0%, rgba(255,176,32,0.04) 100%);
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    transition:transform .1s ease, background .15s ease;
  }
  .weakpoint-card:active{ transform:scale(0.98); }
  .weakpoint-card.empty{
    border-color:rgba(255,255,255,0.12);
    background:var(--card-bg);
  }
  .weakpoint-icon{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:50%;
    background:var(--warn-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--warn);
  }
  .weakpoint-card.empty .weakpoint-icon{
    background:var(--card-bg-strong);
    color:rgba(255,255,255,0.55);
  }
  .weakpoint-icon svg{ width:22px; height:22px; }
  .weakpoint-meta{ flex:1 1 auto; min-width:0; }
  .weakpoint-title{ font-size:14px; font-weight:800; color:#fff; }
  .weakpoint-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .weakpoint-side{ flex:0 0 auto; display:flex; align-items:center; gap:6px; }
  .weakpoint-count{
    font-size:11.5px; font-weight:800; color:var(--warn);
    background:rgba(255,176,32,0.16);
    padding:4px 9px;
    border-radius:99px;
    white-space:nowrap;
  }
  .weakpoint-card.empty .weakpoint-count{
    background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.5);
  }
  .weakpoint-side svg{ width:13px; height:13px; color:rgba(255,255,255,0.32); }

  /* ---------- toast ---------- */
  .toast{
    position:absolute;
    left:20px; right:20px; bottom:28px;
    background:rgba(20,26,38,0.96);
    border:1px solid var(--card-border);
    padding:14px 16px;
    border-radius:14px;
    font-size:12.5px;
    line-height:1.5;
    color:#fff;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease;
    z-index:60;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .chapter-list{
    margin:0 20px 24px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .chapter-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .chapter-card:active{ transform:scale(0.98); background:var(--card-bg-strong); }

  .chapter-icon{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:50%;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .chapter-icon svg{ width:20px; height:20px; }

  .chapter-meta{ flex:1 1 auto; min-width:0; }
  .chapter-meta .tag-row{
    display:flex; align-items:center; gap:6px;
    font-size:11px; margin-bottom:3px;
  }
  .chapter-meta .tag-row .num{ color:var(--accent); font-weight:800; }
  .chapter-meta .tag-row .range{ color:var(--text-tertiary); }
  .chapter-meta .title{
    font-size:13.5px; font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chapter-meta .subtitle{
    font-size:11.5px; color:var(--text-secondary); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .chapter-side{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .chapter-side .count{ font-size:11px; font-weight:700; color:rgba(255,255,255,0.7); }
  .chapter-side svg{ width:13px; height:13px; color:rgba(255,255,255,0.32); }

  /* ================= QUIZ SCREEN ================= */
  .quiz-topbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding:6px 14px;
  }
  .back-btn{
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.07);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .back-btn svg{ width:16px; height:16px; }
  .quiz-topbar .title{
    font-size:14.5px; font-weight:700;
  }

  .quiz-progress-wrap{
    padding:6px 20px 0;
  }
  .quiz-progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .quiz-progress-row .num{
    font-size:11.5px; font-weight:800; color:var(--text-secondary);
  }
  .quiz-progress-row .cat{
    display:flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:var(--accent);
  }
  .quiz-progress-row .cat svg{ width:12px; height:12px; }

  .progress-track{
    height:6px; border-radius:99px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:99px;
    transition:width .28s ease;
  }

  .quiz-body{
    flex:1 1 auto;
    padding:16px 20px 130px;
  }

  .question-text{
    font-size:18px;
    font-weight:700;
    line-height:1.5;
    margin:6px 0 20px;
  }

  .choice-list{ display:flex; flex-direction:column; gap:10px; }

  .choice-row{
    display:flex; align-items:center; gap:12px;
    padding:13px 14px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.1);
    border-radius:14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .choice-row:active{ transform:scale(0.995); }
  .choice-row.disabled{ cursor:default; }

  .choice-row.correct{
    background:var(--success-soft);
    border-color:var(--success);
  }
  .choice-row.wrong{
    background:var(--failure-soft);
    border-color:var(--failure);
  }
  .choice-row.muted{
    border-color:rgba(255,255,255,0.08);
  }

  .choice-badge{
    flex:0 0 auto;
    width:28px; height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:rgba(255,255,255,0.85);
  }
  .choice-badge svg{ width:14px; height:14px; color:#fff; }
  .choice-row.correct .choice-badge{ background:var(--success); }
  .choice-row.wrong .choice-badge{ background:var(--failure); }

  .choice-text{
    font-size:13.5px;
    color:rgba(255,255,255,0.92);
    line-height:1.45;
  }

  .explanation-card{
    margin-top:18px;
    padding:15px;
    background:var(--card-bg);
    border-radius:16px;
    border:1px solid var(--card-border);
    animation:slideDown .25s ease;
  }
  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .explanation-card.correct{ border-color:rgba(51,179,115,0.4); }
  .explanation-card.wrong{ border-color:rgba(230,83,77,0.4); }

  .explanation-title{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:800; margin-bottom:9px;
  }
  .explanation-title svg{ width:16px; height:16px; }
  .explanation-title.correct{ color:var(--success); }
  .explanation-title.wrong{ color:var(--failure); }

  .explanation-body{
    font-size:12.5px; line-height:1.6; color:rgba(255,255,255,0.8);
    margin-bottom:10px;
  }
  .explanation-ref{
    display:flex; align-items:center; gap:6px;
    font-size:10.5px; font-weight:600; color:var(--text-tertiary);
  }
  .explanation-ref svg{ width:12px; height:12px; }

  .quiz-bottom-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:14px 20px 22px;
    background:linear-gradient(180deg, rgba(0,21,43,0) 0%, var(--navy-bottom) 45%);
    display:none;
  }
  .quiz-bottom-bar.show{ display:block; animation:fadeIn .2s ease; }

  .primary-btn{
    width:100%;
    border:none;
    padding:14px 0;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    font-family:inherit;
    box-shadow:0 8px 20px rgba(43,115,250,0.35);
  }
  .primary-btn:active{ transform:scale(0.98); }

  .secondary-btn{
    width:100%;
    border:none;
    padding:14px 0;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.85);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .secondary-btn:active{ transform:scale(0.98); }

  /* ================= RESULT SCREEN ================= */
  .result-wrap{
    flex:1 1 auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px 32px;
    text-align:center;
    gap:22px;
  }
  .result-icon{
    width:78px; height:78px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06);
  }
  .result-icon svg{ width:40px; height:40px; }
  .result-icon.great svg{ color:var(--success); }
  .result-icon.retry svg{ color:var(--accent); }

  .result-title{ font-size:17px; font-weight:800; margin:0; }
  .result-score{ font-size:13.5px; color:var(--text-secondary); margin:4px 0 0; }

  .result-actions{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  /* ---------- exam countdown ---------- */
  .countdown-wrap{ margin:14px 20px 0; }
  .countdown-card{
    padding:16px;
    border-radius:18px;
    background:linear-gradient(135deg, rgba(255,201,77,0.13) 0%, rgba(255,255,255,0.04) 100%);
    border:1px solid rgba(255,201,77,0.3);
    text-align:center;
  }
  .countdown-label{ font-size:12px; font-weight:600; color:var(--text-secondary); }
  .countdown-days{ margin:6px 0 2px; color:#ffc94d; font-weight:800; line-height:1; }
  .countdown-days b{ font-size:52px; letter-spacing:-1px; }
  .countdown-days span{ font-size:16px; margin-left:4px; }
  .countdown-msg{ font-size:14px; font-weight:800; color:#ffc94d; margin:8px 0 2px; line-height:1.5; }
  .countdown-actions{ display:flex; justify-content:center; gap:8px; margin-top:12px; }
  .countdown-link{
    border:1px solid var(--card-border); background:var(--card-bg-strong);
    color:var(--text-secondary); font:inherit; font-size:11.5px; font-weight:700;
    padding:6px 14px; border-radius:99px; cursor:pointer;
  }
  .countdown-set-btn{
    width:100%; padding:14px 16px; border-radius:18px; cursor:pointer;
    border:1px dashed rgba(255,201,77,0.45); background:rgba(255,201,77,0.07);
    color:#ffc94d; font:inherit; font-size:13px; font-weight:800;
  }
  .countdown-edit{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .countdown-edit input[type=date]{
    color-scheme:dark; font:inherit; font-size:14px; color:#fff;
    background:var(--card-bg-strong); border:1px solid var(--card-border);
    border-radius:10px; padding:8px 10px;
  }

  /* ---------- daily recommended ---------- */
  .daily-wrap{ margin:12px 20px 0; }
  .daily-btn{
    width:100%; border:none; padding:15px 0; border-radius:16px; cursor:pointer;
    font:inherit; font-size:14px; font-weight:800; color:#fff;
    background:linear-gradient(135deg, var(--accent) 0%, #1a56c9 100%);
    box-shadow:0 8px 20px rgba(43,115,250,0.35);
  }
  .daily-btn:active{ transform:scale(0.98); }

  /* ---------- feedback report ---------- */
  .report-btn{
    display:block; width:100%; margin-top:12px; padding:9px 0;
    border:1px solid var(--card-border); border-radius:10px;
    background:transparent; color:var(--text-secondary);
    font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .sheet-backdrop{
    position:absolute; inset:0; z-index:70;
    background:rgba(0,10,22,0.6);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:71;
    max-height:78%; overflow-y:auto;
    padding:10px 20px 24px;
    background:linear-gradient(180deg, var(--navy-top) 0%, var(--navy-deep) 100%);
    border-top:1px solid var(--card-border);
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.45);
    transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-grip{ width:38px; height:4px; border-radius:99px; background:rgba(255,255,255,0.25); margin:0 auto 12px; }
  .sheet h3{ margin:0 0 12px; font-size:15px; font-weight:800; }

/* =========================================================
   弱点克服モード ― LocalStorageによる間違えた問題の記憶
   一等・二等でデータが混ざらないよう、ライセンス別にキーを分離する
   ========================================================= */
const WRONG_IDS_KEY_PREFIX = "droneQuizWrongQuestionIds_";
const LEGACY_WRONG_IDS_KEY = "droneQuizWrongQuestionIds";

function wrongIdsKey(license){
  return WRONG_IDS_KEY_PREFIX + license;
}

function loadWrongIds(license){
  try{
    const raw = localStorage.getItem(wrongIdsKey(license));
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){
    return [];
  }
}

function saveWrongIds(license, ids){
  try{
    localStorage.setItem(wrongIdsKey(license), JSON.stringify(ids));
  }catch(e){
    /* localStorageが利用できない環境では記憶をスキップする */
  }
}

/* 旧バージョン（一等・二等共通キー）からの一度限りの移行 */
(function migrateLegacyWrongIds(){
  try{
    const raw = localStorage.getItem(LEGACY_WRONG_IDS_KEY);
    if(!raw) return;
    const legacyIds = JSON.parse(raw);
    if(Array.isArray(legacyIds)){
      ["first","second"].forEach(license => {
        if(localStorage.getItem(wrongIdsKey(license))) return;
        const filtered = legacyIds.filter(id => {
          const q = QUESTIONS.find(x => x.id === id);
          return q && q.licenses.includes(license);
        });
        if(filtered.length > 0) saveWrongIds(license, filtered);
      });
    }
    localStorage.removeItem(LEGACY_WRONG_IDS_KEY);
  }catch(e){
    /* 移行に失敗しても通常動作に影響させない */
  }
})();

/* =========================================================
   学習進捗（達成度・正解率）― ライセンス別に累積記録
   ========================================================= */
function progressKey(license){
  return "droneQuizProgress_" + license;
}

function loadProgress(license){
  try{
    const raw = localStorage.getItem(progressKey(license));
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === "object") ? obj : {};
  }catch(e){
    return {};
  }
}

function saveProgress(license, progress){
  try{
    localStorage.setItem(progressKey(license), JSON.stringify(progress));
  }catch(e){
    /* localStorageが利用できない環境では記憶をスキップする */
  }
}

function recordProgress(license, questionId, isCorrect){
  const progress = loadProgress(license);
  progress[questionId] = isCorrect;
  saveProgress(license, progress);
}

function renderProgressGauge(){
  const wrap = document.getElementById('progressGauge');
  if(!wrap) return;
  const license = state.license;
  const total = QUESTIONS.filter(q => q.licenses.includes(license)).length;
  const progress = loadProgress(license);
  const answeredIds = Object.keys(progress).filter(id => {
    const q = QUESTIONS.find(x => x.id === id);
    return q && q.licenses.includes(license);
  });
  const answered = answeredIds.length;
  const correct = answeredIds.filter(id => progress[id]).length;
  const pct = total > 0 ? Math.round((answered/total)*100) : 0;
  const accuracy = answered > 0 ? Math.round((correct/answered)*100) : 0;
  const label = license === 'first' ? '一等資格' : '二等資格';

  wrap.innerHTML = `
    <div class="progress-card">
      <div class="progress-card-head">
        <span class="progress-card-title">${label} 学習進捗</span>
        <span class="progress-card-pct">${pct}%</span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressGaugeFill" style="width:0%"></div></div>
      <div class="progress-card-foot">
        <span>解答済み ${answered} / ${total}問</span>
        <span>正解率 ${answered > 0 ? accuracy + '%' : '―'}</span>
      </div>
    </div>
  `;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const fill = document.getElementById('progressGaugeFill');
    if(fill) fill.style.width = pct + '%';
  }));
}

function recordAnswer(questionId, isCorrect){
  const license = state.license;
  const ids = loadWrongIds(license);
  const idx = ids.indexOf(questionId);
  if(isCorrect){
    if(idx !== -1){
      ids.splice(idx, 1);
      saveWrongIds(license, ids);
    }
  } else if(idx === -1){
    ids.push(questionId);
    saveWrongIds(license, ids);
  }
  recordProgress(license, questionId, isCorrect);
  renderWeakPointCard();
  renderProgressGauge();
}

let toastTimer = null;
function showToast(message){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = message;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3400);
}

function renderWeakPointCard(){
  const wrap = document.getElementById('weakPointWrap');
  if(!wrap) return;
  const count = loadWrongIds(state.license).length;
  wrap.innerHTML = `
    <button class="weakpoint-card ${count===0 ? 'empty' : ''}" onclick="startWeakPointMode()">
      <div class="weakpoint-icon">${ICONS.target}</div>
      <div class="weakpoint-meta">
        <div class="weakpoint-title">弱点克服モード</div>
        <div class="weakpoint-sub">間違えた問題だけを復習</div>
      </div>
      <div class="weakpoint-side">
        <span class="weakpoint-count">${count}問</span>
        ${ICONS.chevronRight}
      </div>
    </button>
  `;
}

function startWeakPointMode(){
  const ids = loadWrongIds(state.license);
  const questions = ids.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);

  if(questions.length === 0){
    showToast('現在、間違えた問題はありません。満点を目指して挑戦しましょう！');
    return;
  }

  state.mode = 'weak';
  state.chapter = null;
  state.sessionQuestions = shuffle(questions);
  state.currentIndex = 0;
  state.correctCount = 0;
  state.selectedIndex = null;
  state.isRevealed = false;

  document.getElementById('quizChapterTitle').textContent = '弱点克服モード';
  showScreen('quizScreen');
  renderQuestion();
}

/* =========================================================
   CBT試験日カウントダウン（localStorage: droneExamTargetDate = "YYYY-MM-DD"）
   ========================================================= */
const EXAM_DATE_KEY = "droneExamTargetDate";
let countdownEditing = false;

function loadExamDate(){
  try{
    const v = localStorage.getItem(EXAM_DATE_KEY);
    return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null;
  }catch(e){ return null; }
}

function saveExamDate(v){
  try{
    if(v) localStorage.setItem(EXAM_DATE_KEY, v);
    else localStorage.removeItem(EXAM_DATE_KEY);
  }catch(e){ /* localStorage不可の環境では保存をスキップ */ }
}

function renderCountdown(){
  const wrap = document.getElementById('countdownArea');
  if(!wrap) return;
  const saved = loadExamDate();

  if(countdownEditing || !saved){
    if(!countdownEditing){
      wrap.innerHTML = `<button class="countdown-set-btn" onclick="editCountdown()">試験日を設定してカウントダウンを開始</button>`;
      return;
    }
    wrap.innerHTML = `
      <div class="countdown-card">
        <div class="countdown-label">CBT試験日を選択</div>
        <div class="countdown-edit" style="margin-top:10px;">
          <input type="date" id="examDateInput" value="${saved || ''}">
          <button class="countdown-link" onclick="confirmCountdown()">保存</button>
          <button class="countdown-link" onclick="cancelCountdown()">キャンセル</button>
        </div>
      </div>`;
    return;
  }

  const [y, m, d] = saved.split('-').map(Number);
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const days = Math.round((target - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  const dateText = `${y}年${m}月${d}日(${'日月火水木金土'[target.getDay()]})`;
  const actions = `
    <div class="countdown-actions">
      <button class="countdown-link" onclick="editCountdown()">再設定</button>
      <button class="countdown-link" onclick="clearCountdown()">クリア</button>
    </div>`;

  let body;
  if(days > 0){
    body = `<div class="countdown-label">${dateText} の試験まで あと</div>
            <div class="countdown-days"><b>${days}</b><span>日</span></div>`;
  } else if(days === 0){
    body = `<div class="countdown-label">${dateText}</div>
            <div class="countdown-msg">いよいよ試験当日です！<br>これまでの努力を信じて、頑張ってください！</div>`;
  } else {
    body = `<div class="countdown-label">${dateText}</div>
            <div class="countdown-msg">設定した試験日は過ぎました。<br>次の試験日を再設定しましょう。</div>`;
  }
  wrap.innerHTML = `<div class="countdown-card">${body}${actions}</div>`;
}

function editCountdown(){ countdownEditing = true; renderCountdown(); }
function cancelCountdown(){ countdownEditing = false; renderCountdown(); }
function confirmCountdown(){
  const v = document.getElementById('examDateInput').value;
  if(!v){ showToast('試験日を選択してください。'); return; }
  saveExamDate(v);
  countdownEditing = false;
  renderCountdown();
}
function clearCountdown(){
  saveExamDate(null);
  countdownEditing = false;
  renderCountdown();
}

/* =========================================================
   今日のおすすめ問題（10問）― 誤答優先で最大5問 + ランダムで補完
   ========================================================= */
const DAILY_TOTAL = 10;
const DAILY_WRONG_MAX = 5;

function buildDailyQuestions(){
  const license = state.license;
  const wrong = shuffle(loadWrongIds(license)
    .map(id => QUESTIONS.find(q => q.id === id))
    .filter(q => q && q.licenses.includes(license))).slice(0, DAILY_WRONG_MAX);
  const picked = new Set(wrong.map(q => q.id));
  const rest = shuffle(QUESTIONS.filter(q => q.licenses.includes(license) && !picked.has(q.id)));
  return shuffle(wrong.concat(rest.slice(0, DAILY_TOTAL - wrong.length)));
}

function startDailyMode(){
  state.mode = 'daily';
  state.chapter = null;
  state.sessionQuestions = buildDailyQuestions();
  state.currentIndex = 0;
  state.correctCount = 0;
  state.selectedIndex = null;
  state.isRevealed = false;
  showScreen('quizScreen');
  renderQuestion();
}

/* =========================================================
   問題・解説の報告 ― ハーフモーダル + Googleフォーム(formResponse)へ送信
   ※ 下記URL/entry IDを実際のフォームの値に書き換えること。
      URLに "PLACEHOLDER" が含まれる間は送信せずモック動作(console出力のみ)。
   ========================================================= */
const APP_VERSION = "1.0.0";
const FEEDBACK_FORM_URL = "https://docs.google.com/forms/d/e/PLACEHOLDER_FORM_ID/formResponse";
const FEEDBACK_ENTRY = {
  questionId: "entry.0000000001",
  target:     "entry.0000000002",
  kinds:      "entry.0000000003",
  note:       "entry.0000000004",
  device:     "entry.0000000005",
  version:    "entry.0000000006",
};

function getOSInfo(){
  const ua = navigator.userAgent || "";
  let m;
  if((m = ua.match(/(?:iPhone|iPad|CPU) OS (\d+)[_.](\d+)/))) return `iOS ${m[1]}.${m[2]}`;
  if((m = ua.match(/Android (\d+(?:\.\d+)?)/))) return `Android ${m[1]}`;
  if(/Windows/.test(ua)) return "Windows";
  if(/Mac OS X/.test(ua)) return "macOS";
  if(/Linux/.test(ua)) return "Linux";
  return "Unknown";
}

function openReport(){
  document.querySelectorAll('#reportKinds input').forEach(c => c.checked = false);
  document.querySelectorAll('#reportTarget button').forEach((b, i) => b.classList.toggle('active', i === 0));
  document.getElementById('reportNote').value = '';
  document.getElementById('reportCount').textContent = '0';
  document.getElementById('reportBackdrop').classList.add('show');
  document.getElementById('reportSheet').classList.add('show');
}

function closeReport(){
  document.getElementById('reportBackdrop').classList.remove('show');
  document.getElementById('reportSheet').classList.remove('show');
}

document.getElementById('reportTarget').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#reportTarget button').forEach(b => b.classList.toggle('active', b === btn));
});

function submitReport(){
  const kinds = [...document.querySelectorAll('#reportKinds input:checked')].map(c => c.value);
  if(kinds.length === 0){ showToast('内容を1つ以上選択してください。'); return; }

  const body = new URLSearchParams();
  body.append(FEEDBACK_ENTRY.questionId, currentQuestion().id);
  body.append(FEEDBACK_ENTRY.target, document.querySelector('#reportTarget .active').dataset.v);
  kinds.forEach(k => body.append(FEEDBACK_ENTRY.kinds, k));
  body.append(FEEDBACK_ENTRY.note, document.getElementById('reportNote').value.slice(0, 250));
  body.append(FEEDBACK_ENTRY.device, getOSInfo());
  body.append(FEEDBACK_ENTRY.version, APP_VERSION);

  closeReport();
  if(FEEDBACK_FORM_URL.includes("PLACEHOLDER")){
    console.info("[report:mock]", body.toString());
  } else {
    /* no-corsのためレスポンスは読めない（送信のみ）。失敗は握りつぶす */
    fetch(FEEDBACK_FORM_URL, { method:"POST", mode:"no-cors", body }).catch(() => {});
  }
  showToast('ご報告ありがとうございます。内容を確認します。');
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function questionsFor(chapterId, license){
  return QUESTIONS.filter(q => q.chapterID===chapterId && q.licenses.includes(license));
}

/* =========================================================
   RENDER: MENU SCREEN
   ========================================================= */
function setLicense(license){
  state.license = license;
  document.getElementById('btnFirst').classList.toggle('active', license==='first');
  document.getElementById('btnSecond').classList.toggle('active', license==='second');
  document.getElementById('licenseThumb').style.transform = license==='first' ? 'translateX(0)' : 'translateX(100%)';
  document.getElementById('menuSubtitle').textContent =
    (license==='first' ? '一等' : '二等') + '資格の出題範囲を、教則の章ごとに演習できます。';
  renderChapterList();
  renderWeakPointCard();
  renderProgressGauge();
}

function renderChapterList(){
  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const count = questionsFor(ch.id, state.license).length;
    const card = document.createElement('div');
    card.className = 'chapter-card';
    card.onclick = () => { if(count>0) startQuiz(ch.id); };
    card.innerHTML = `
      <div class="chapter-icon">${ICONS[ch.icon]}</div>
      <div class="chapter-meta">
        <div class="tag-row"><span class="num">第${ch.id}章</span><span class="range">${ch.pageRange}</span></div>
        <div class="title">${ch.title}</div>
        <div class="subtitle">${ch.subtitle}</div>
      </div>
      <div class="chapter-side">
        <span class="count">${count}問</span>
        ${ICONS.chevronRight}
      </div>
    `;
    list.appendChild(card);
  });
}

/* =========================================================
   RENDER: QUIZ SCREEN
   ========================================================= */
function startQuiz(chapterId){
  state.mode = 'chapter';
  state.chapter = CHAPTERS.find(c => c.id===chapterId);
  state.sessionQuestions = shuffle(questionsFor(chapterId, state.license));
  state.currentIndex = 0;
  state.correctCount = 0;
  state.selectedIndex = null;
  state.isRevealed = false;

  document.getElementById('quizChapterTitle').textContent = `第${chapterId}章`;
  showScreen('quizScreen');
  renderQuestion();
}

function currentQuestion(){
  return state.sessionQuestions[state.currentIndex];
}

function renderQuestion(){
  const q = currentQuestion();
  const total = state.sessionQuestions.length;

  if(state.mode === 'daily'){
    document.getElementById('quizChapterTitle').textContent = `今日のおすすめ問題（${state.currentIndex+1} / ${total}）`;
  }
  document.getElementById('quizNumLabel').textContent = `${state.currentIndex+1} / ${total}`;
  document.getElementById('quizCategoryLabel').textContent = q.category;
  document.getElementById('progressFill').style.width = `${(state.currentIndex/total)*100}%`;
  document.getElementById('questionText').textContent = q.question;

  const choiceList = document.getElementById('choiceList');
  choiceList.innerHTML = '';
  q.choices.forEach((text, idx) => {
    const row = document.createElement('div');
    row.className = 'choice-row';
    row.onclick = () => selectChoice(idx);
    row.innerHTML = `
      <div class="choice-badge">${CHOICE_LABELS[idx] || '?'}</div>
      <div class="choice-text">${text}</div>
    `;
    choiceList.appendChild(row);
  });

  document.getElementById('explanationSlot').innerHTML = '';
  document.getElementById('quizBottomBar').classList.remove('show');
}

function selectChoice(idx){
  if(state.isRevealed) return;
  const q = currentQuestion();
  state.selectedIndex = idx;
  state.isRevealed = true;
  const isCorrect = idx === q.correct;
  if(isCorrect) state.correctCount++;
  recordAnswer(q.id, isCorrect);

  const rows = document.querySelectorAll('#choiceList .choice-row');
  rows.forEach((row, i) => {
    row.classList.add('disabled');
    row.onclick = null;
    const badge = row.querySelector('.choice-badge');
    if(i === q.correct){
      row.classList.add('correct');
      badge.innerHTML = ICONS.check;
    } else if(i === idx){
      row.classList.add('wrong');
      badge.innerHTML = ICONS.cross;
    } else {
      row.classList.add('muted');
    }
  });

  const slot = document.getElementById('explanationSlot');
  slot.innerHTML = `
    <div class="explanation-card ${isCorrect?'correct':'wrong'}">
      <div class="explanation-title ${isCorrect?'correct':'wrong'}">
        ${isCorrect ? ICONS.seal : ICONS.warnSeal}
        <span>${isCorrect ? '正解です' : '不正解です'}</span>
      </div>
      <div class="explanation-body">${q.explanation}</div>
      <div class="explanation-ref">${ICONS.book}<span>${EDITION} ${q.ref} より引用・準拠</span></div>
      <button class="report-btn" onclick="openReport()">問題や解説の気になる点を報告</button>
    </div>
  `;

  const total = state.sessionQuestions.length;
  const isLast = state.currentIndex === total - 1;
  document.getElementById('nextBtn').textContent = isLast ? '結果を見る' : '次の問題へ';
  document.getElementById('quizBottomBar').classList.add('show');
}

function nextQuestion(){
  if(!state.isRevealed) return;
  const total = state.sessionQuestions.length;
  if(state.currentIndex === total - 1){
    document.getElementById('progressFill').style.width = `100%`;
    showResult();
    return;
  }
  state.currentIndex++;
  state.selectedIndex = null;
  state.isRevealed = false;
  renderQuestion();
}

/* =========================================================
   RENDER: RESULT SCREEN
   ========================================================= */
function showResult(){
  const total = state.sessionQuestions.length;
  const accuracy = total>0 ? state.correctCount/total : 0;
  const great = accuracy >= 0.8;

  document.getElementById('resultTitle').textContent =
    state.mode === 'daily' ? '本日の学習完了！' :
    state.mode === 'weak' ? '弱点克服モード 完了' : `第${state.chapter.id}章 完了`;
  document.getElementById('resultScore').textContent = `${state.correctCount} / ${total} 問正解`;

  const iconWrap = document.getElementById('resultIconWrap');
  const showStar = great || state.mode === 'daily';
  iconWrap.className = 'result-icon ' + (showStar ? 'great' : 'retry');
  iconWrap.innerHTML = showStar ? ICONS.star : ICONS.retry;

  showScreen('resultScreen');
  renderWeakPointCard();
}

function retryChapter(){
  if(state.mode === 'daily'){
    startDailyMode();
  } else if(state.mode === 'weak'){
    const remaining = loadWrongIds(state.license);
    if(remaining.length === 0){
      showToast('弱点はすべて克服しました！お見事です。');
      backToMenu();
      return;
    }
    startWeakPointMode();
  } else {
    startQuiz(state.chapter.id);
  }
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function backToMenu(){
  showScreen('menuScreen');
  renderCountdown();
  renderWeakPointCard();
  renderProgressGauge();
}

/* =========================================================
   INIT
   ========================================================= */
function initClock(){
  const el = document.getElementById('clock');
  const update = () => {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    el.textContent = `${h}:${m}`;
  };
  update();
  setInterval(update, 15000);
}

renderChapterList();
renderWeakPointCard();
renderProgressGauge();
renderCountdown();
initClock();
</script>
