<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドローン国家資格 学科対策 | DroneQuizApp</title>
<style>
  :root{
    --navy-top:#0a2a4d;
    --navy-deep:#002244;
    --navy-bottom:#00152b;
    --accent:#2b73fa;
    --accent-soft:rgba(43,115,250,0.14);
    --success:#33b373;
    --success-soft:rgba(51,179,115,0.16);
    --failure:#e6534d;
    --failure-soft:rgba(230,83,77,0.16);
    --text-primary:#ffffff;
    --text-secondary:rgba(255,255,255,0.62);
    --text-tertiary:rgba(255,255,255,0.4);
    --card-bg:rgba(255,255,255,0.05);
    --card-bg-strong:rgba(255,255,255,0.08);
    --card-border:rgba(255,255,255,0.09);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #f3f5f9 0%, #e4e8ef 45%, #d6dbe4 100%);
    color:var(--text-primary);
  }

  /* ---------- Desktop layout: phone frame ---------- */
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:32px 16px;
  }

  .page-caption{
    text-align:center;
    color:#5b6472;
  }
  .page-caption b{
    color:#1a2233;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .page-caption span{
    display:block;
    font-size:12.5px;
    margin-top:4px;
    color:#8992a1;
  }

  .phone-frame{
    position:relative;
    width:390px;
    height:844px;
    max-height:88vh;
    background:linear-gradient(160deg,#1b1d22,#08090b);
    border-radius:56px;
    padding:14px;
    box-shadow:
      0 40px 80px -20px rgba(10,20,40,0.45),
      0 10px 30px -10px rgba(10,20,40,0.35),
      inset 0 0 0 2px rgba(255,255,255,0.06);
  }
  .phone-frame::before{ /* side buttons - right (power) */
    content:"";
    position:absolute; right:-3px; top:180px;
    width:3px; height:70px; border-radius:2px;
    background:#2a2c31;
  }
  .phone-frame::after{ /* side buttons - left (volume) */
    content:"";
    position:absolute; left:-3px; top:140px;
    width:3px; height:46px; border-radius:2px;
    background:#2a2c31;
    box-shadow: 0 60px 0 0 #2a2c31, 0 108px 0 0 #2a2c31;
  }

  .phone-notch{
    position:absolute;
    top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:26px;
    background:#08090b;
    border-radius:16px;
    z-index:20;
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:14px;
  }
  .phone-notch .cam{
    width:8px; height:8px; border-radius:50%;
    background:#1b2735;
    box-shadow: inset 0 0 0 1.5px #0d1520;
  }

  .phone-screen{
    position:relative;
    width:100%; height:100%;
    border-radius:42px;
    overflow:hidden;
    background:linear-gradient(180deg,var(--navy-top) 0%, var(--navy-deep) 45%, var(--navy-bottom) 100%);
    display:flex;
    flex-direction:column;
  }

  /* ---------- fake iOS status bar ---------- */
  .status-bar{
    flex:0 0 auto;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px 0 30px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    color:#fff;
  }
  .status-icons{ display:flex; align-items:center; gap:6px; }
  .status-icons svg{ display:block; }

  /* ---------- app content area ---------- */
  .app-content{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    display:flex;
    flex-direction:column;
  }
  .app-content::-webkit-scrollbar{ display:none; }

  .screen{
    display:none;
    flex-direction:column;
    flex:1 1 auto;
    min-height:100%;
    animation:fadeIn .28s ease;
  }
  .screen.active{ display:flex; }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ================= MENU SCREEN ================= */
  .menu-header{ padding:6px 20px 0; }
  .menu-header h1{
    margin:0 0 6px;
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .menu-header p{
    margin:0;
    font-size:13.5px;
    color:var(--text-secondary);
    line-height:1.5;
  }

  .license-picker{
    margin:18px 20px 0;
    display:flex;
    gap:0;
    padding:4px;
    background:rgba(255,255,255,0.06);
    border-radius:14px;
  }
  .license-btn{
    flex:1;
    border:none;
    cursor:pointer;
    padding:10px 0;
    font-size:13.5px;
    font-weight:700;
    border-radius:10px;
    background:transparent;
    color:rgba(255,255,255,0.55);
    transition:background .2s ease, color .2s ease;
    font-family:inherit;
  }
  .license-btn.active{
    background:var(--accent);
    color:#fff;
    box-shadow:0 4px 14px rgba(43,115,250,0.35);
  }

  .compliance-banner{
    margin:16px 20px 0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    background:var(--accent-soft);
    border:1px solid rgba(43,115,250,0.32);
    border-radius:14px;
  }
  .compliance-banner .icon{
    flex:0 0 auto;
    width:20px; height:20px;
    color:var(--accent);
  }
  .compliance-banner .texts b{
    display:block;
    font-size:12.5px;
    font-weight:700;
  }
  .compliance-banner .texts span{
    display:block;
    font-size:11px;
    color:var(--text-secondary);
    margin-top:1px;
  }

  .section-title{
    margin:22px 20px 10px;
    font-size:14.5px;
    font-weight:700;
  }

  .chapter-list{
    margin:0 20px 24px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .chapter-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .chapter-card:active{ transform:scale(0.98); background:var(--card-bg-strong); }

  .chapter-icon{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:50%;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .chapter-icon svg{ width:20px; height:20px; }

  .chapter-meta{ flex:1 1 auto; min-width:0; }
  .chapter-meta .tag-row{
    display:flex; align-items:center; gap:6px;
    font-size:11px; margin-bottom:3px;
  }
  .chapter-meta .tag-row .num{ color:var(--accent); font-weight:800; }
  .chapter-meta .tag-row .range{ color:var(--text-tertiary); }
  .chapter-meta .title{
    font-size:13.5px; font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chapter-meta .subtitle{
    font-size:11.5px; color:var(--text-secondary); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .chapter-side{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .chapter-side .count{ font-size:11px; font-weight:700; color:rgba(255,255,255,0.7); }
  .chapter-side svg{ width:13px; height:13px; color:rgba(255,255,255,0.32); }

  /* ================= QUIZ SCREEN ================= */
  .quiz-topbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding:6px 14px;
  }
  .back-btn{
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.07);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .back-btn svg{ width:16px; height:16px; }
  .quiz-topbar .title{
    font-size:14.5px; font-weight:700;
  }

  .quiz-progress-wrap{
    padding:6px 20px 0;
  }
  .quiz-progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .quiz-progress-row .num{
    font-size:11.5px; font-weight:800; color:var(--text-secondary);
  }
  .quiz-progress-row .cat{
    display:flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:var(--accent);
  }
  .quiz-progress-row .cat svg{ width:12px; height:12px; }

  .progress-track{
    height:6px; border-radius:99px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:99px;
    transition:width .28s ease;
  }

  .quiz-body{
    flex:1 1 auto;
    padding:16px 20px 130px;
  }

  .question-text{
    font-size:18px;
    font-weight:700;
    line-height:1.5;
    margin:6px 0 20px;
  }

  .choice-list{ display:flex; flex-direction:column; gap:10px; }

  .choice-row{
    display:flex; align-items:center; gap:12px;
    padding:13px 14px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.1);
    border-radius:14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .choice-row:active{ transform:scale(0.995); }
  .choice-row.disabled{ cursor:default; }

  .choice-row.correct{
    background:var(--success-soft);
    border-color:var(--success);
  }
  .choice-row.wrong{
    background:var(--failure-soft);
    border-color:var(--failure);
  }
  .choice-row.muted{
    border-color:rgba(255,255,255,0.08);
  }

  .choice-badge{
    flex:0 0 auto;
    width:28px; height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:rgba(255,255,255,0.85);
  }
  .choice-badge svg{ width:14px; height:14px; color:#fff; }
  .choice-row.correct .choice-badge{ background:var(--success); }
  .choice-row.wrong .choice-badge{ background:var(--failure); }

  .choice-text{
    font-size:13.5px;
    color:rgba(255,255,255,0.92);
    line-height:1.45;
  }

  .explanation-card{
    margin-top:18px;
    padding:15px;
    background:var(--card-bg);
    border-radius:16px;
    border:1px solid var(--card-border);
    animation:slideDown .25s ease;
  }
  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .explanation-card.correct{ border-color:rgba(51,179,115,0.4); }
  .explanation-card.wrong{ border-color:rgba(230,83,77,0.4); }

  .explanation-title{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:800; margin-bottom:9px;
  }
  .explanation-title svg{ width:16px; height:16px; }
  .explanation-title.correct{ color:var(--success); }
  .explanation-title.wrong{ color:var(--failure); }

  .explanation-body{
    font-size:12.5px; line-height:1.6; color:rgba(255,255,255,0.8);
    margin-bottom:10px;
  }
  .explanation-ref{
    display:flex; align-items:center; gap:6px;
    font-size:10.5px; font-weight:600; color:var(--text-tertiary);
  }
  .explanation-ref svg{ width:12px; height:12px; }

  .quiz-bottom-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:14px 20px 22px;
    background:linear-gradient(180deg, rgba(0,21,43,0) 0%, var(--navy-bottom) 45%);
    display:none;
  }
  .quiz-bottom-bar.show{ display:block; animation:fadeIn .2s ease; }

  .primary-btn{
    width:100%;
    border:none;
    padding:14px 0;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    font-family:inherit;
    box-shadow:0 8px 20px rgba(43,115,250,0.35);
  }
  .primary-btn:active{ transform:scale(0.98); }

  .secondary-btn{
    width:100%;
    border:none;
    padding:14px 0;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.85);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .secondary-btn:active{ transform:scale(0.98); }

  /* ================= RESULT SCREEN ================= */
  .result-wrap{
    flex:1 1 auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px 32px;
    text-align:center;
    gap:22px;
  }
  .result-icon{
    width:78px; height:78px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06);
  }
  .result-icon svg{ width:40px; height:40px; }
  .result-icon.great svg{ color:var(--success); }
  .result-icon.retry svg{ color:var(--accent); }

  .result-title{ font-size:17px; font-weight:800; margin:0; }
  .result-score{ font-size:13.5px; color:var(--text-secondary); margin:4px 0 0; }

  .result-actions{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  /* ================= responsive: real mobile browsers ================= */
  @media (max-width:480px){
    body{ background:var(--navy-deep); }
    .page{ padding:0; gap:0; min-height:100dvh; }
    .page-caption{ display:none; }
    .phone-frame{
      width:100%; height:100dvh; max-height:none;
      border-radius:0; padding:0; box-shadow:none; background:none;
    }
    .phone-frame::before, .phone-frame::after{ display:none; }
    .phone-notch{ display:none; }
    .phone-screen{ border-radius:0; height:100%; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="page-caption">
    <b>DroneQuizApp Web Preview</b>
    <span>SwiftUIプロトタイプ準拠 &middot; ブラウザ動作版</span>
  </div>

  <div class="phone-frame">
    <div class="phone-notch"><div class="cam"></div></div>

    <div class="phone-screen">
      <!-- status bar -->
      <div class="status-bar">
        <span id="clock">9:41</span>
        <div class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#fff"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4.5C5.5 0.5 10.5 0.5 15 4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M4 7.5C6.8 5 9.2 5 12 7.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="8" cy="10.3" r="1.1" fill="#fff"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="2.5" stroke="#fff" stroke-opacity="0.6" stroke-width="1"/><rect x="2.2" y="2.2" width="16" height="7.6" rx="1.3" fill="#fff"/><rect x="22" y="4" width="1.6" height="4" rx="0.8" fill="#fff" fill-opacity="0.6"/></svg>
        </div>
      </div>

      <div class="app-content">

        <!-- ============ MENU SCREEN ============ -->
        <section class="screen active" id="menuScreen">
          <div class="menu-header">
            <h1>無人航空機操縦士 学科試験</h1>
            <p id="menuSubtitle">二等資格の出題範囲を、教則の章ごとに演習できます。</p>
          </div>

          <div class="license-picker">
            <button class="license-btn" id="btnFirst" onclick="setLicense('first')">一等資格</button>
            <button class="license-btn active" id="btnSecond" onclick="setLicense('second')">二等資格</button>
          </div>

          <div class="compliance-banner">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12.2l2 2 4.2-4.2"/></svg></div>
            <div class="texts">
              <b>国土交通省 教則第5版 準拠</b>
              <span>全設問に該当教則ページを明示</span>
            </div>
          </div>

          <div class="section-title">章から選ぶ</div>
          <div class="chapter-list" id="chapterList"></div>
        </section>

        <!-- ============ QUIZ SCREEN ============ -->
        <section class="screen" id="quizScreen" style="position:relative;">
          <div class="quiz-topbar">
            <button class="back-btn" onclick="backToMenu()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="title" id="quizChapterTitle">第1章</div>
          </div>

          <div class="quiz-progress-wrap">
            <div class="quiz-progress-row">
              <span class="num" id="quizNumLabel">1 / 8</span>
              <span class="cat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.7L12.7 20.6a2 2 0 01-2.8 0l-7.5-7.5a2 2 0 010-2.8L10.3 2.4A2 2 0 0111.7 2H19a2 2 0 012 2v7.3a2 2 0 01-.4 1.4z"/><circle cx="15" cy="7" r="1.4"/></svg>
                <span id="quizCategoryLabel">操縦者の心得</span>
              </span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          </div>

          <div class="quiz-body" id="quizBody">
            <div class="question-text" id="questionText"></div>
            <div class="choice-list" id="choiceList"></div>
            <div id="explanationSlot"></div>
          </div>

          <div class="quiz-bottom-bar" id="quizBottomBar">
            <button class="primary-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
          </div>
        </section>

        <!-- ============ RESULT SCREEN ============ -->
        <section class="screen" id="resultScreen">
          <div class="result-wrap">
            <div class="result-icon" id="resultIconWrap"></div>
            <div>
              <p class="result-title" id="resultTitle">第1章 完了</p>
              <p class="result-score" id="resultScore">6 / 8 問正解</p>
            </div>
            <div class="result-actions">
              <button class="primary-btn" onclick="retryChapter()">もう一度解く</button>
              <button class="secondary-btn" onclick="backToMenu()">章一覧に戻る</button>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ICONS ― SFSymbols風のミニマルなインラインSVGアイコン
   ========================================================= */
const ICONS = {
  shieldCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12.2l2 2 4.2-4.2"/></svg>',
  fileSearch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h9a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><circle cx="9.5" cy="14.5" r="2.1"/><path d="M11.1 16.1L12.6 17.6"/></svg>',
  cpu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',

/* =========================================================
   STATE ― QuizSessionViewModel 相当
   ========================================================= */
const state = {
  license: "second",
  chapter: null,
  sessionQuestions: [],
  currentIndex: 0,
  selectedIndex: null,
  isRevealed: false,
  correctCount: 0,
};

const CHOICE_LABELS = ["A","B","C","D","E"];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function questionsFor(chapterId, license){
  return QUESTIONS.filter(q => q.chapterID===chapterId && q.licenses.includes(license));
}

/* =========================================================
   RENDER: MENU SCREEN
   ========================================================= */
function setLicense(license){
  state.license = license;
  document.getElementById('btnFirst').classList.toggle('active', license==='first');
  document.getElementById('btnSecond').classList.toggle('active', license==='second');
  document.getElementById('menuSubtitle').textContent =
    (license==='first' ? '一等' : '二等') + '資格の出題範囲を、教則の章ごとに演習できます。';
  renderChapterList();
}

function renderChapterList(){
  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const count = questionsFor(ch.id, state.license).length;
    const card = document.createElement('div');
    card.className = 'chapter-card';
    card.onclick = () => { if(count>0) startQuiz(ch.id); };
    card.innerHTML = `
      <div class="chapter-icon">${ICONS[ch.icon]}</div>
      <div class="chapter-meta">
        <div class="tag-row"><span class="num">第${ch.id}章</span><span class="range">${ch.pageRange}</span></div>
        <div class="title">${ch.title}</div>
        <div class="subtitle">${ch.subtitle}</div>
      </div>
      <div class="chapter-side">
        <span class="count">${count}問</span>
        ${ICONS.chevronRight}
      </div>
    `;
    list.appendChild(card);
  });
}

/* =========================================================
   RENDER: QUIZ SCREEN
   ========================================================= */
function startQuiz(chapterId){
  state.chapter = CHAPTERS.find(c => c.id===chapterId);
  state.sessionQuestions = shuffle(questionsFor(chapterId, state.license));
  state.currentIndex = 0;
  state.correctCount = 0;
  state.selectedIndex = null;
  state.isRevealed = false;

  document.getElementById('quizChapterTitle').textContent = `第${chapterId}章`;
  showScreen('quizScreen');
  renderQuestion();
}

function currentQuestion(){
  return state.sessionQuestions[state.currentIndex];
}

function renderQuestion(){
  const q = currentQuestion();
  const total = state.sessionQuestions.length;

  document.getElementById('quizNumLabel').textContent = `${state.currentIndex+1} / ${total}`;
  document.getElementById('quizCategoryLabel').textContent = q.category;
  document.getElementById('progressFill').style.width = `${(state.currentIndex/total)*100}%`;
  document.getElementById('questionText').textContent = q.question;

  const choiceList = document.getElementById('choiceList');
  choiceList.innerHTML = '';
  q.choices.forEach((text, idx) => {
    const row = document.createElement('div');
    row.className = 'choice-row';
    row.onclick = () => selectChoice(idx);
    row.innerHTML = `
      <div class="choice-badge">${CHOICE_LABELS[idx] || '?'}</div>
      <div class="choice-text">${text}</div>
    `;
    choiceList.appendChild(row);
  });

  document.getElementById('explanationSlot').innerHTML = '';
  document.getElementById('quizBottomBar').classList.remove('show');
}

function selectChoice(idx){
  if(state.isRevealed) return;
  const q = currentQuestion();
  state.selectedIndex = idx;
  state.isRevealed = true;
  const isCorrect = idx === q.correct;
  if(isCorrect) state.correctCount++;

  const rows = document.querySelectorAll('#choiceList .choice-row');
  rows.forEach((row, i) => {
    row.classList.add('disabled');
    row.onclick = null;
    const badge = row.querySelector('.choice-badge');
    if(i === q.correct){
      row.classList.add('correct');
      badge.innerHTML = ICONS.check;
    } else if(i === idx){
      row.classList.add('wrong');
      badge.innerHTML = ICONS.cross;
    } else {
      row.classList.add('muted');
    }
  });

  const slot = document.getElementById('explanationSlot');
  slot.innerHTML = `
    <div class="explanation-card ${isCorrect?'correct':'wrong'}">
      <div class="explanation-title ${isCorrect?'correct':'wrong'}">
        ${isCorrect ? ICONS.seal : ICONS.warnSeal}
        <span>${isCorrect ? '正解です' : '不正解です'}</span>
      </div>
      <div class="explanation-body">${q.explanation}</div>
      <div class="explanation-ref">${ICONS.book}<span>${EDITION} ${q.page}</span></div>
    </div>
  `;

  const total = state.sessionQuestions.length;
  const isLast = state.currentIndex === total - 1;
  document.getElementById('nextBtn').textContent = isLast ? '結果を見る' : '次の問題へ';
  document.getElementById('quizBottomBar').classList.add('show');
}

function nextQuestion(){
  if(!state.isRevealed) return;
  const total = state.sessionQuestions.length;
  if(state.currentIndex === total - 1){
    document.getElementById('progressFill').style.width = `100%`;
    showResult();
    return;
  }
  state.currentIndex++;
  state.selectedIndex = null;
  state.isRevealed = false;
  renderQuestion();
}

/* =========================================================
   RENDER: RESULT SCREEN
   ========================================================= */
function showResult(){
  const total = state.sessionQuestions.length;
  const accuracy = total>0 ? state.correctCount/total : 0;
  const great = accuracy >= 0.8;

  document.getElementById('resultTitle').textContent = `第${state.chapter.id}章 完了`;
  document.getElementById('resultScore').textContent = `${state.correctCount} / ${total} 問正解`;

  const iconWrap = document.getElementById('resultIconWrap');
  iconWrap.className = 'result-icon ' + (great ? 'great' : 'retry');
  iconWrap.innerHTML = great ? ICONS.star : ICONS.retry;

  showScreen('resultScreen');
}

function retryChapter(){
  startQuiz(state.chapter.id);
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function backToMenu(){
  showScreen('menuScreen');
}

/* =========================================================
   INIT
   ========================================================= */
function initClock(){
  const el = document.getElementById('clock');
  const update = () => {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    el.textContent = `${h}:${m}`;
  };
  update();
  setInterval(update, 15000);
}

renderChapterList();
initClock();
</script>
